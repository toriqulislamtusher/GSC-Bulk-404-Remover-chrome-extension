name: Extension checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js
          node --check safety.js
      - name: Mock regression tests
        run: node tests/regression.cjs
